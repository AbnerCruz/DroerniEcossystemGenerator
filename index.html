<!--
  Sem build step: cada arquivo abaixo é transformado (JSX -> JS) e
  executado pelo Babel Standalone no navegador, em ordem. Scripts
  clássicos (não-module) compartilham o mesmo escopo global — uma
  const declarada em 01-core-motor.js é visível em 09-app.js.

  Tudo fica na RAIZ do projeto (sem subpastas) de propósito — só
  assim dá pra fazer upload direto pelo app do GitHub no celular,
  que não aceita upload de pasta, só de arquivos soltos.

  Isso EXIGE servir via http(s), não abrir o index.html direto do
  disco (file://): tanto o Babel (pra buscar o src de cada script)
  quanto os patchnotes (fetch de patchnotes-manifest.json e .md)
  usam fetch/XHR, que o navegador bloqueia por CORS em file://.

  Rodar localmente: dentro desta pasta, `python3 -m http.server`
  e abrir http://localhost:8000
  Publicar: GitHub Pages já serve por https, funciona direto.
-->
<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback, useRef, useEffect } = React;
</script>

<!--
  PWA — registro do service worker.

  Fica DEPOIS dos scripts do app e fora do Babel de propósito: é JS puro,
  não depende de nada do app, e não deve atrasar a primeira pintura.

  O registro é silencioso quando dá certo. Quando falha (navegador antigo,
  servido por http sem TLS, modo anônimo), o app segue funcionando normal
  — só não fica offline. Service worker é melhoria, nunca requisito.

  `sw.js` fica na raiz junto de tudo, então o escopo é a pasta do app —
  o que é exatamente o certo pro GitHub Pages, onde o app vive em
  usuario.github.io/repositorio/ e não pode reivindicar a raiz do domínio.
-->
<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      window.__swRegistro = reg;
      // avisa a aba quando houver uma versão nova esperando pra assumir
      reg.addEventListener("updatefound", function () {
        var novo = reg.installing;
        if (!novo) return;
        novo.addEventListener("statechange", function () {
          if (novo.state === "installed" && navigator.serviceWorker.controller) {
            window.dispatchEvent(new CustomEvent("drn2:atualizacao-disponivel"));
          }
        });
      });
    }).catch(function () { /* sem offline; o app continua funcionando online */ });

    var recarregou = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (recarregou) return; recarregou = true; window.location.reload();
    });
  });

  // guarda o evento de instalação pra oferecer o botão "Instalar" na hora certa
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    window.__promptInstalacao = e;
    window.dispatchEvent(new CustomEvent("drn2:instalavel"));
  });
})();
</script>
