  assim dá pra fazer upload direto pelo app do GitHub no celular,
  que não aceita upload de pasta, só de arquivos soltos.

  usam fetch/XHR, que o navegador bloqueia por CORS em file://.

  Rodar localmente: dentro desta pasta, `python3 -m http.server`
  e abrir http://localhost:8000
  Publicar: GitHub Pages já serve por https, funciona direto.
-->
